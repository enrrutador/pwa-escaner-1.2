<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Sin conexión - StockMaster</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b1220;
      color: #e8e8ec;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .icon {
      width: 80px; height: 80px;
      margin-bottom: 24px;
      opacity: 0.6;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
    p { color: #9aa4b2; font-size: 1rem; margin-bottom: 24px; max-width: 280px; }
    .btn {
      background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
      color: #1a1a2e;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(217, 119, 6, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:active { transform: scale(0.96); box-shadow: 0 2px 8px rgba(217, 119, 6, 0.4); }
    .retry { margin-top: 16px; color: #9aa4b2; font-size: 0.85rem; }
  </style>
</head>
<body>
  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18.36 6.64A9 9 0 0 1 20.77 15"/>
    <path d="M12 2v4"/>
    <path d="M12 18v4"/>
    <path d="M4.93 4.93l2.83 2.83"/>
    <path d="M16.24 16.24l2.83 2.83"/>
    <path d="M2 12h4"/>
    <path d="M18 12h4"/>
    <path d="M4.93 19.07l2.83-2.83"/>
    <path d="M16.24 7.76l2.83-2.83"/>
  </svg>
  <h1>Sin conexión</h1>
  <p>No hay internet disponible. La app funciona offline para ver tu inventario, pero necesitas conexión para sincronizar cambios o buscar productos online.</p>
  <button class="btn" onclick="window.location.reload()">Reintentar conexión</button>
  <p class="retry">Los datos locales siguen disponibles</p>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then(reg => {
        setInterval(() => {
          fetch('/', { method: 'HEAD', cache: 'no-cache' })
            .then(() => window.location.reload())
            .catch(() => {});
        }, 30000);
      });
    }
  </script>
</body>
</html>
